name: Update threat feed

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "seeds/**"
      - "config/**"
      - "collector/**"

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 collector/collect.py

      - name: Commit changes
        run: |
          git config user.name "edtechblockfeed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fortigate review data docs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          STATS=$(python3 -c "import json;s=json.load(open('data/state.json'))['stats'];print(f\"domains={s['domains_txt_entries']} priority={s['domains_priority_entries']} urls={s['urls_entries']} discovered={s['discovered_confirmed']} pending={s['discovered_pending']}\")")
          git commit -m "Feed update: $STATS"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
            sleep $((i * 10))
          done
