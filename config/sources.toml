# ---------------------------------------------------------------------------
# GitHub discovery: repositories tagged with these topics / matching these
# searches. The repo "homepage" field and URLs in the README are harvested,
# then fingerprinted live before entering the feed.
# ---------------------------------------------------------------------------

[github]
topics = [
  "unblocked-games",
  "unblockedgames",
  "unblocked-games-site",
  "unblocked-games-website",
  "unblockedforschool",
  "unblockers-for-school",
  "school-games",
  "games-unblocked",
  "html5-games",
  "browser-games",
  "gn-math",
  "eaglercraft",
  "school-unblocker",
  "scramjet",
]
# Whole GitHub organisations whose repos' homepages / Pages are harvested:
# the authors of the main web-proxy frameworks.
orgs = ["MercuryWorkshop", "titaniumnetwork-dev"]
queries = [
  "unblocked games in:name,description",
  "unblocked games school in:readme",
  "games site school chromebook in:name,description,readme",
]
# Only repos pushed within this many days are processed.
pushed_within_days = 120
# Max search result pages per topic/query (100 repos per page, GitHub caps at 10).
max_pages = 5
# Max READMEs fetched per run (raw.githubusercontent.com, not API-rate-limited).
max_readmes = 300

# ---------------------------------------------------------------------------
# Link aggregator pages students use. Every outbound link is harvested and
# fingerprinted. Add pages here as you find them.
# ---------------------------------------------------------------------------

[aggregators]
urls = [
  "https://raw.githubusercontent.com/yourworstnightmare1/proxy-list/main/links.txt",
  "https://raw.githubusercontent.com/yourworstnightmare1/proxy-list/main/unsorted_links.txt",
  "https://raw.githubusercontent.com/wea-f/ByePassHub/main/README.md",
  "https://gist.githubusercontent.com/eddy-22/2cdfadfa539cdaccfd0a9e31bf98e6d6/raw/unblocked_sites.md",
  "https://raw.githubusercontent.com/Carter54git/Ultimate-Catalog-Of-Web-Game-Ports/main/README.md",
  "https://raw.githubusercontent.com/bns34/Unblocked-Sites/main/README.md",
  "https://raw.githubusercontent.com/task4z/unblockedgames/main/README.md",
  "https://raw.githubusercontent.com/0800WebDev/UBGdir/main/README.md",
]

# ---------------------------------------------------------------------------
# Certificate Transparency (crt.sh). Finds brand-new hosts on free hosting
# platforms whose names contain these keywords. crt.sh is often slow/down;
# failures are logged and skipped.
# ---------------------------------------------------------------------------

[ct]
enabled = true
keywords = ["unblocked", "unblockedgames", "ubg", "gnmath", "gn-math", "eaglercraft", "freegames", "schoolgames", "mathgames"]
suffixes = ["pages.dev", "vercel.app", "netlify.app", "github.io", "workers.dev", "onrender.com", "it.com", "web.app"]

# ---------------------------------------------------------------------------
# Shared-CDN loaders (GitHub repos / npm packages opened through jsDelivr,
# unpkg, esm.sh, statically, githack). Links come from every discovery source
# above; these settings add owner expansion and GitHub code search.
# ---------------------------------------------------------------------------

[cdn]
# Open a GitHub issue when a new CDN/mirror is detected (Actions only).
open_issues = true
# Re-list each confirmed owner's repositories this often (days).
owner_expand_days = 1
owner_expand_max = 40       # owners expanded per run
owner_repos_max = 40        # newest repos listed per owner
files_per_repo = 6          # likely entry files (index.*, *.svg, *.html) checked per repo
# GitHub code search for the loader signature: a full-screen SVG that embeds
# HTML through <foreignObject> and loads an iframe or script. Needs a token
# (the Actions GITHUB_TOKEN works); limited to 10 requests per minute.
code_search_pages = 1
code_search_queries = [
  'foreignObject "position:fixed" iframe extension:svg',
  'foreignObject "position: fixed" iframe extension:svg',
  'foreignObject "position:fixed" script extension:svg',
  'foreignObject "inset:0" iframe extension:svg',
  'foreignObject "100vw" iframe extension:svg',
  'foreignObject "1999/xhtml" "about:blank" extension:svg',
]

# ---------------------------------------------------------------------------
# urlscan.io search: pages other people scanned that load the web-proxy
# frameworks' files or carry "unblocked games" titles. Free public API; an
# optional URLSCAN_API_KEY repository secret raises the rate limits. Every hit
# still has to pass the live fingerprint (results also contain phishing kits
# built on the same proxy code).
# ---------------------------------------------------------------------------

[urlscan]
enabled = true
interval_hours = 6          # search at most this often
days = 3                    # only scans from the last N days
max_per_domain = 3          # cap hits per registrable domain per run
queries = [
  'filename:"uv.bundle.js"',
  'filename:"scramjet.all.js"',
  'filename:"baremux/worker.js"',
  'filename:"epoxy/index.mjs"',
  'page.title:"unblocked games"',
]
# Wildcard-IP and throwaway-DNS services: scans of them are mostly random
# generated names, not sites students are given.
skip_domains = ["sslip.io", "nip.io", "ipv64.net", "ipv64.de", "local-ip.sh", "traefik.me",
                "xip.io", "nip.direct", "anyip.dev", "lvh.me", "localtest.me",
                "f5.si", "dynipv6.de", "cpanel.site"]
# Hosts with these words are phishing kits built on the same proxy code
# (fake billing / sign-in pages): out of scope for a games feed.
skip_keywords = ["netflix", "paypal", "billing", "signin", "sign-in", "verify",
                 "payment", "wallet", "login-", "account-", "appleid", "microsoft-"]

# ---------------------------------------------------------------------------
# Stalled sites (alive, but no game/proxy markup, usually JavaScript-only or
# device-locked proxies) from dedicated student bypass lists are decided by
# page identity instead of markup. Applies only to subdomains of unranked
# domains and free-hosting subdomains, never to whole or popular domains.
# ---------------------------------------------------------------------------

[stalled]
enabled = true
# Sources whose every link is meant as a bypass (README links and catalogs are
# NOT included: most of their stalled links are ordinary pages).
trusted_sources = [
  "aggregator:https://raw.githubusercontent.com/yourworstnightmare1/proxy-list/",
  "urlscan:",
]
# Same normalized page on this many hosts from those sources = a deployed clone.
min_cluster = 3

# Titles naming these services on a site that is not theirs = impersonation.
[stalled.impersonated_services]
"coursera" = ["coursera.org"]
"ixl" = ["ixl.com"]
"canvas" = ["instructure.com", "canvas.net"]
"google classroom" = ["google.com"]
"clever" = ["clever.com"]
"schoology" = ["schoology.com"]
"khan academy" = ["khanacademy.org"]
"quizlet" = ["quizlet.com"]
"edpuzzle" = ["edpuzzle.com"]
"desmos" = ["desmos.com"]
"deltamath" = ["deltamath.com"]
"powerschool" = ["powerschool.com"]
"classlink" = ["classlink.com"]
"kahoot" = ["kahoot.com", "kahoot.it"]
"blooket" = ["blooket.com"]
"gimkit" = ["gimkit.com"]
"nasa" = ["nasa.gov"]
"harvard" = ["harvard.edu"]
"wikipedia" = ["wikipedia.org"]

# ---------------------------------------------------------------------------
# Proxy server IPs (fortigate/proxyips.txt): dedicated servers hosting bypass
# sites under many rotating names. Blocking the server catches names no source
# has seen yet. Use as a FortiGate IP address threat feed (DNS filter
# external IP block list and/or a firewall deny policy).
# ---------------------------------------------------------------------------

[liveness]
# Dead-domain maintenance for curated-list entries (collector/liveness.py).
# Lists rarely remove dead domains; these are kept out of the feed so devices
# only carry live threats. Only an NXDOMAIN answer agreed by both resolvers
# counts; timeouts never do. Dropped names are re-checked and return if alive.
enabled = true
budget = 6000               # DNS checks per run
recheck_alive_days = 14     # re-check a live name this often
recheck_dead_days = 3       # re-check a failing or dropped name this often
drop_after_checks = 3       # NXDOMAIN answers needed before dropping...
drop_after_days = 14        # ...spread over at least this many days
resolvers = ["1.1.1.1", "8.8.8.8"]
workers = 48

[proxy_ips]
enabled = true
min_confirmed = 2           # confirmed bypass names needed on one server...
min_ratio = 0.6             # ...making up at least this share of its known names
held_min_names = 3          # stalled names (with proxy/decoy naming) to hold a server for review
max_age_days = 30           # drop an IP when no qualifying name has pointed at it for this long
resolve_budget = 4000       # hostnames resolved per run (each re-resolved at most daily)
# Never published, in addition to Cloudflare's ranges (fetched each run) and
# private/reserved space: load balancers and front ends shared by many
# unrelated sites.
shared_ranges = [
  "185.199.108.0/22",   # GitHub Pages
  "151.101.0.0/16",     # Fastly
  "146.75.0.0/16",      # Fastly
  "199.232.0.0/16",     # Fastly
  "76.76.21.0/24",      # Vercel
  "66.33.60.0/24",      # Vercel
  "75.2.60.5/32",       # Netlify load balancer
  "99.83.231.61/32",    # Netlify load balancer
  "98.84.224.111/32",   # Netlify
  "18.208.88.157/32",   # Netlify
  "216.24.57.0/24",     # Render
  "199.36.158.100/32",  # Firebase Hosting
  "142.250.0.0/15",     # Google
  "142.251.0.0/16",     # Google
  "172.217.0.0/16",     # Google
  "216.239.32.0/19",    # Google (incl. Google Sites custom domains)
  "198.185.159.0/24",   # Squarespace
  "198.49.23.0/24",     # Squarespace
  "23.227.38.0/24",     # Shopify
  "192.0.78.0/24",      # WordPress.com
  "23.236.62.147/32",   # Wix
]
# Network owners (from RIPEstat) whose addresses are shared by many unrelated
# sites: never published even with strong evidence. An IP whose owner can't be
# looked up is not published either.
excluded_asns = [
  16509, 14618,          # Amazon (AWS, CloudFront; Vercel front ends)
  13335, 209242,         # Cloudflare
  15169, 396982, 19527,  # Google
  8075, 8068,            # Microsoft
  54113,                 # Fastly
  20940, 16625, 21342,   # Akamai CDN (Linode VPS, AS63949, stays eligible)
  36459,                 # GitHub
  133618, 47846, 397241, # Trellian / Sedo / parking
  34119,                 # Wildcard UK (free hosting)
  22612,                 # Namecheap shared hosting
  46606,                 # Unified Layer (Bluehost)
  26496, 398101,         # GoDaddy
