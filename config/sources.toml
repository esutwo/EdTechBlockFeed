# EdTechBlockFeed collector configuration.
#
# Every tier goes into fortigate/domains.txt (the main feed).
# tier = "priority" -> also in fortigate/domains-priority.txt: unblocked /
#                      school-bypass game sites (the ones FortiGuard usually does
#                      NOT rate as Games). A smaller feed for low-capacity models.
# tier = "general"  -> broad gaming category lists (mostly also rated Games by
#                      FortiGuard; included anyway as defense in depth).
#
# trusted = true    -> entries go straight into the feed (curated lists)
# trusted = false   -> entries must pass the live fingerprint check first;
#                      inconclusive hosts land in review/pending.txt

[settings]
# Hosts discovered (not from a trusted list) are kept this many days after the
# last time they were seen alive / fingerprinted.
discovered_max_age_days = 60
# Live verification budget per run (hosts / Google URLs, and CDN files).
verify_max_hosts = 1500
verify_max_cdn = 1500
verify_workers = 32
verify_timeout = 10
# Re-check already-confirmed discovered hosts after this many days.
reverify_after_days = 7
# Also emit "*.example.com" next to registrable domains so subdomains match.
emit_wildcards = true
# FortiGate threat feeds have per-feed entry limits (model dependent). Output
# files are split into domains.txt, domains-2.txt, ... at this many lines.
max_lines_per_file = 100000
# CDN loaders (urls.txt): an owner with this many confirmed loader repos is
# blocked as a whole on every mirror; below it, only the confirmed repos are.
owner_promote_min = 2
# Guards for sites the collector discovers on its own (curated lists are not
# affected), using the Tranco popularity ranking:
#   rank <= popular_guard_top          never auto-blocked; held for review
#   rank <= popular_list_size          a game sub-page blocks the whole host
#                                      only if the homepage is a game site too
#   unranked (obscure) domains         a game sub-page is enough (disguised
#                                      bypass sites hide games behind a decoy)
popular_guard_top = 10000
popular_list_size = 100000
# "wildcard" -> cdn.jsdelivr.net/gh/owner/*  and  sites.google.com/view/name*
#               Every path entry ends in "*", the form FortiOS documents
#               ("wildcards are allowed at the beginning or end of the URL").
# "prefix"   -> cdn.jsdelivr.net/gh/owner/   (relies on prefix matching, which
#               FortiOS doesn't document; produced no hits in testing)
url_entry_style = "wildcard"

# ---------------------------------------------------------------------------
