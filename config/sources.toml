# EdTechBlockFeed collector configuration.
#
# Every tier goes into fortigate/domains.txt (the main feed).
# tier = "priority" -> also in fortigate/domains-priority.txt: unblocked /
#                      school-bypass game sites (the ones FortiGuard usually does
#                      NOT rate as Games). A smaller feed for low-capacity models.
# tier = "general"  -> broad gaming category lists (mostly also rated Games by
#                      FortiGuard; included anyway as defense in depth).
#
# trusted = true    -> entries go straight into the feed (curated lists)
# trusted = false   -> entries must pass the live fingerprint check first;
#                      inconclusive hosts land in review/pending.txt

[settings]
# Hosts discovered (not from a trusted list) are kept this many days after the
# last time they were seen alive / fingerprinted.
discovered_max_age_days = 60
# Hosts from lists are kept this many days after they disappear from all lists
# (protects against a source being briefly broken).
list_grace_days = 7
# Live verification budget per run.
verify_max_hosts = 1500
verify_workers = 32
verify_timeout = 10
# Re-check already-confirmed discovered hosts after this many days.
reverify_after_days = 7
# Also emit "*.example.com" next to registrable domains so subdomains match.
emit_wildcards = true
# FortiGate threat feeds have per-feed entry limits (model dependent). Output
# files are split into domains.txt, domains-2.txt, ... at this many lines.
max_lines_per_file = 100000

# ---------------------------------------------------------------------------
# Curated lists
# format: hosts | adblock | domains | ut1 (UT1 tar.gz) | adguard-services (JSON)
# Whole-platform entries (pages.dev, github.io, ...), whole-TLD rules, regex
# rules and anything in seeds/allow.txt are stripped automatically.
# Licenses: see README "Sources and licenses".
# ---------------------------------------------------------------------------

# --- Unblocked / school-bypass game sites (priority tier) ---

